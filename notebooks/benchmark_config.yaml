# Benchmark configuration for run_benchmarks_notebook_modular.ipynb

seed: 0
# Paths
data_dir: /home/ace/Downloads/Dataset
save_dir: ./out_cityscapes_final_notebook
device: cuda
batch_size: 2
num_workers: 4

conf_threshold: 0.6
mass_coverage: 0.99
n_qual_samples: 6
plot_scenarios:
  - Day-RAIN
  - Sunset-FOGGY
  - Night-RAIN
plot_drop_classname: train

# Qualitative visualization model
qual_model_key: segformer_b5

# New modular model configuration
# Add or remove models here without touching the benchmark notebook.
models:
  enabled:
    - segformer_b0
    - segformer_b2
    - segformer_b5
    - mask2former_swin_s
    - mask2former_swin_l

